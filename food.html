<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAO - 캠퍼스 맛집 & 리뷰</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <header id="app-header"></header>

    <main>
        <div class="page-header">
            <h2>🍜 캠퍼스 맛집 & 영수증 리뷰</h2>
            <p>카테고리별 학교 앞 인기 맛집을 탐색하고, 학우들의 솔직한 한줄 리뷰를 남겨보세요.</p>
        </div>
        

        <!-- 카테고리 필터 버튼 -->
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1.2rem;">
            <button class="btn btn-sm" id="filter-all" onclick="filterStores('전체')">전체 보기</button>
            <button class="btn btn-sm btn-outline" id="filter-korean" onclick="filterStores('한식')">🍚 한식</button>
            <button class="btn btn-sm btn-outline" id="filter-asian" onclick="filterStores('중식·일식')">🍜 중식·일식</button>
            <button class="btn btn-sm btn-outline" id="filter-cafe" onclick="filterStores('카페·디저트')">☕ 카페·디저트</button>
        </div>

        <!-- 맛집 카드 피드 -->
        <div id="store-grid" class="grid-3"></div>

        <!-- 학생 영수증 한줄 리뷰 영역 -->
        <div class="grid-2" style="margin-top:2rem;">
            <section class="card">
                <h3>✍️ 학생 영수증 한줄 리뷰 작성</h3>
                <label for="rev-store">가게명</label>
                <input type="text" id="rev-store" placeholder="예: 학식당 돈까스킹">

                <label for="rev-rating">별점 선택</label>
                <select id="rev-rating">
                    <option value="5">⭐⭐⭐⭐⭐ (5점 - 강력 추천!)</option>
                    <option value="4">⭐⭐⭐⭐ (4점 - 맛있어요)</option>
                    <option value="3">⭐⭐⭐ (3점 - 무난해요)</option>
                </select>

                <label for="rev-text">한줄 후기</label>
                <textarea id="rev-text" rows="3" placeholder="메뉴 추천이나 공강 시간 이용 팁을 남겨주세요."></textarea>

                <button class="btn btn-accent btn-full" onclick="addReview()">리뷰 등록하기</button>
            </section>

            <section class="card">
                <h3>📋 실시간 학우 리뷰 피드</h3>
                <div id="review-feed" style="max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;"></div>
            </section>
        </div>
    </main>

    <footer id="app-footer"></footer>

    <script src="common.js"></script>
    <script>
        renderLayout('food');

        const stores = [
            { name: '학식당 돈까스킹', category: '중식·일식', menu: '왕돈까스 & 우동 세트 (7,500원)', desc: '공강 30분 컷 가능한 빠른 서빙과 푸짐한 양으로 사랑받는 정문 앞 터줏대감.' },
            { name: '정문 앞 마라탕후루', category: '중식·일식', menu: '1인 마라탕 + 미니 꿔바로우 (9,900원)', desc: '조모임 끝나고 친구들과 커스텀 재료 골라 담기 좋은 인기 매장.' },
            { name: '든든한 국밥집', category: '한식', menu: '얼큰 순대국밥 / 돼지국밥 (8,500원)', desc: '공기밥 무한 리필 제공! 해장이나 든든한 한 끼가 필요할 때 최고.' },
            { name: '할머니 손칼국수', category: '한식', menu: '바지락 칼국수 & 왕만두 (8,000원)', desc: '비 오는 날 캠퍼스 학우들이 가장 먼저 찾는 따뜻한 국물 맛집.' },
            { name: '밤샘 카페 아지트', category: '카페·디저트', menu: '아이스 아메리카노 1L (3,500원)', desc: '전 좌석 콘센트 완비 및 와이파이 빵빵한 팀플·시험기간 성지.' },
            { name: '달콤 와플하우스', category: '카페·디저트', menu: '생크림 사과잼 와플 (4,000원)', desc: '오후 수업 전 당 충전 필수 코스! 포장 주문 시 500원 할인.' }
        ];

        function filterStores(cat) {
            const grid = document.getElementById('store-grid');
            const filtered = cat === '전체' ? stores : stores.filter(s => s.category === cat);
            const state = getAppState();

            grid.innerHTML = filtered.map(store => {
                const isFav = state.favFoods.includes(store.name);
                return `
                    <div class="card">
                        <h3>
                            <span>${store.name}</span>
                            <span style="font-size:0.78rem; background:#eff6ff; color:#1e3a8a; padding:3px 8px; border-radius:12px;">${store.category}</span>
                        </h3>
                        <p style="font-size:0.9rem; font-weight:bold; color:#d97706; margin-bottom:6px;">🍽️ 대표: ${store.menu}</p>
                        <p style="font-size:0.9rem; color:#475569; margin-bottom:14px;">${store.desc}</p>
                        <button class="btn btn-sm ${isFav ? 'btn-accent' : 'btn-outline'} btn-full" onclick="toggleFav('${store.name}')">
                            ${isFav ? '❤️ 즐겨찾기 등록됨' : '🤍 즐겨찾기 추가'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        function toggleFav(storeName) {
            const state = getAppState();
            const idx = state.favFoods.indexOf(storeName);
            if (idx > -1) {
                state.favFoods.splice(idx, 1);
                showToast(`'${storeName}' 즐겨찾기가 해제되었습니다.`);
            } else {
                state.favFoods.push(storeName);
                showToast(`'${storeName}'이(가) 마이페이지 즐겨찾기에 추가되었습니다.`);
            }
            saveAppState(state);
            filterStores('전체');
        }

        function renderReviews() {
            const state = getAppState();
            const feed = document.getElementById('review-feed');
            feed.innerHTML = state.reviews.map(r => `
                <div class="result-box" style="margin-top:0;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <strong>${r.store}</strong>
                        <span style="color:#f59e0b;">${'⭐'.repeat(Number(r.rating))}</span>
                    </div>
                    <p style="font-size:0.92rem; margin-bottom:4px;">${r.text}</p>
                    <span style="font-size:0.8rem; color:#64748b;">작성자: ${r.author} | ${r.date}</span>
                </div>
            `).join('');
        }

        function addReview() {
            const store = document.getElementById('rev-store').value.trim();
            const rating = document.getElementById('rev-rating').value;
            const text = document.getElementById('rev-text').value.trim();

            if (!store || !text) {
                alert('가게명과 한줄 후기를 모두 입력해주세요!');
                return;
            }

            const state = getAppState();
            const author = state.user ? `${state.user.nickname} (${state.user.studentId})` : '익명 학우';
            const today = new Date().toISOString().split('T')[0];

            state.reviews.unshift({ store, rating, text, author, date: today });
            saveAppState(state);

            document.getElementById('rev-store').value = '';
            document.getElementById('rev-text').value = '';
            renderReviews();
            showToast('영수증 한줄 리뷰가 등록되었습니다!');
        }

        filterStores('전체');
        renderReviews();
    </script>
</body>
</html>
