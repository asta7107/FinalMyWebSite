<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAO - 로그인</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <header id="app-header"></header>

    <main style="display:flex; justify-content:center; align-items:center;">
        <div class="card" style="width:100%; max-width:430px; padding:2rem;">
            <div style="text-align:center; margin-bottom:1.5rem;">
                <h2 style="color:var(--primary); font-size:1.6rem;">🎓 CAO 로그인</h2>
                <p style="color:var(--muted); font-size:0.92rem; margin-top:4px;">학교 이메일(@ac.kr)로 로그인하고 내 기록을 연동하세요.</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <label for="login-email">대학교 이메일 (@ac.kr)</label>
                <input type="email" id="login-email" placeholder="example@univ.ac.kr" required>

                <label for="login-pw">비밀번호</label>
                <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" required>

                <div style="display:flex; align-items:center; gap:6px; margin-bottom:14px;">
                    <input type="checkbox" id="keep-login" style="width:auto; margin:0;">
                    <label for="keep-login" style="margin:0; font-weight:normal; font-size:0.88rem; color:var(--muted);">로그인 상태 유지</label>
                </div>

                <button type="submit" class="btn btn-full">로그인</button>
            </form>

            <div style="margin:1.2rem 0; text-align:center; color:var(--muted); font-size:0.85rem;">또는 소셜 계정 간편 로그인</div>

            <div style="display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="btn btn-full" style="background:#fee500; color:#191919;" onclick="socialLogin('카카오 학우')">💬 카카오 계정으로 3초 로그인</button>
                <button type="button" class="btn btn-full" style="background:#03c75a; color:#ffffff;" onclick="socialLogin('네이버 학우')">N 네이버 계정으로 로그인</button>
            </div>

            <p style="text-align:center; margin-top:1.4rem; font-size:0.9rem; color:var(--muted);">
                아직 CAO 회원이 아니신가요? <a href="signup.html" style="color:var(--primary-light); font-weight:bold;">회원가입 하기</a>
            </p>
        </div>
    </main>

    <footer id="app-footer"></footer>

    <script src="common.js"></script>
    <script>
        if (typeof renderLayout === 'function') {
            renderLayout('login');
        }

        function appendAuthLog(action, userInfo, keepLogin) {
            const logKey = 'cao_auth_records';
            let records = [];
            try {
                const raw = localStorage.getItem(logKey);
                records = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(records)) records = [];
            } catch (err) {
                records = [];
            }

            records.unshift({
                action,
                email: userInfo.email,
                studentId: userInfo.studentId || '',
                nickname: userInfo.nickname || '',
                favCategory: userInfo.favCategory || '',
                keepLogin: Boolean(keepLogin),
                timestamp: new Date().toISOString()
            });

            try {
                localStorage.setItem(logKey, JSON.stringify(records));
                localStorage.setItem('cao_current_user', JSON.stringify({
                    ...userInfo,
                    keepLogin: Boolean(keepLogin)
                }));
            } catch (err) {
                console.warn('로컬 스토리지 기록 저장 실패:', err);
            }
        }

        function findSavedProfile(email) {
            try {
                const raw = localStorage.getItem('cao_auth_records');
                const records = raw ? JSON.parse(raw) : [];
                if (Array.isArray(records)) {
                    const matched = records.find(
                        (item) => item && item.email && item.email.toLowerCase() === email.toLowerCase() && item.nickname
                    );
                    if (matched) {
                        return {
                            studentId: matched.studentId || '23학번',
                            nickname: matched.nickname,
                            favCategory: matched.favCategory || '한식'
                        };
                    }
                }
            } catch (err) {
                // ignore storage read error
            }
            return null;
        }

        function saveLoginSession(userObj, actionLabel, keepLogin) {
            if (typeof getAppState === 'function' && typeof saveAppState === 'function') {
                const state = getAppState();
                state.user = {
                    email: userObj.email,
                    studentId: userObj.studentId,
                    nickname: userObj.nickname,
                    favCategory: userObj.favCategory
                };
                state.keepLogin = Boolean(keepLogin);
                state.authHistory = Array.isArray(state.authHistory) ? state.authHistory : [];
                state.authHistory.unshift({
                    action: actionLabel,
                    email: userObj.email,
                    nickname: userObj.nickname,
                    keepLogin: Boolean(keepLogin),
                    timestamp: new Date().toISOString()
                });
                saveAppState(state);
            }

            appendAuthLog(actionLabel, {
                ...userObj,
                loggedIn: true,
                updatedAt: new Date().toISOString()
            }, keepLogin);
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pw = document.getElementById('login-pw').value;
            const keepLogin = document.getElementById('keep-login').checked;

            if (!email) {
                alert('이메일을 입력하세요.');
                return;
            }

            void pw;
            const prefix = email.split('@')[0];
            const saved = findSavedProfile(email);
            const userObj = {
                email,
                studentId: saved ? saved.studentId : '23학번',
                nickname: saved ? saved.nickname : prefix,
                favCategory: saved ? saved.favCategory : '한식'
            };

            saveLoginSession(userObj, '이메일 로그인', keepLogin);

            if (typeof showToast === 'function') {
                showToast(`${userObj.nickname}님 환영합니다!`);
            } else {
                alert(`${userObj.nickname}님 환영합니다!`);
            }

            setTimeout(() => {
                location.href = 'index.html';
            }, 700);
        }

        function socialLogin(providerName) {
            const keepLogin = document.getElementById('keep-login').checked;
            const userObj = {
                email: 'student@campus.ac.kr',
                studentId: '23학번',
                nickname: providerName,
                favCategory: '전체'
            };

            saveLoginSession(userObj, `${providerName} 간편 로그인`, keepLogin);

            if (typeof showToast === 'function') {
                showToast(`${providerName} 계정으로 간편 로그인되었습니다.`);
            } else {
                alert(`${providerName} 계정으로 간편 로그인되었습니다.`);
            }

            setTimeout(() => {
                location.href = 'index.html';
            }, 700);
        }
    </script>
</body>
</html>
