<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAO - 로그인</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <header id="app-header"></header>

    <main style="display:flex; justify-content:center; align-items:center;">
        <div class="card" style="width:100%; max-width:430px; padding:2rem;">
            <div style="text-align:center; margin-bottom:1.5rem;">
                <h2 style="color:var(--primary); font-size:1.6rem;">🎓 CAO 로그인</h2>
                <p style="color:var(--muted); font-size:0.92rem; margin-top:4px;">학교 이메일(@ac.kr)로 로그인하고 내 기록을 연동하세요.</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <label for="login-email">대학교 이메일 (@ac.kr)</label>
                <input type="email" id="login-email" placeholder="example@univ.ac.kr" required>

                <label for="login-pw">비밀번호</label>
                <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" required>

                <div style="display:flex; align-items:center; gap:6px; margin-bottom:14px;">
                    <input type="checkbox" id="keep-login" style="width:auto; margin:0;">
                    <label for="keep-login" style="margin:0; font-weight:normal; font-size:0.88rem; color:var(--muted);">로그인 상태 유지</label>
                </div>

                <button type="submit" class="btn btn-full">로그인</button>
            </form>

            <div style="margin:1.2rem 0; text-align:center; color:var(--muted); font-size:0.85rem;">또는 소셜 계정 간편 로그인</div>

            <div style="display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="btn btn-full" style="background:#fee500; color:#191919;" onclick="socialLogin('kakao', '카카오 학우')">💬 카카오 계정으로 3초 로그인</button>
                <button type="button" class="btn btn-full" style="background:#03c75a; color:#ffffff;" onclick="socialLogin('naver', '네이버 학우')">N 네이버 계정으로 로그인</button>
            </div>

            <p style="text-align:center; margin-top:1.4rem; font-size:0.9rem; color:var(--muted);">
                아직 CAO 회원이 아니신가요? <a href="signup.html" style="color:var(--primary-light); font-weight:bold;">회원가입 하기</a>
            </p>
        </div>
    </main>

    <footer id="app-footer"></footer>

    <script src="common.js"></script>
    <script>
        if (typeof renderLayout === 'function') {
            renderLayout('login');
        }

        const ACCOUNTS_KEY = 'cao_accounts';
        const AUTH_LOGS_KEY = 'cao_auth_records';
        const CURRENT_USER_KEY = 'cao_current_user';

        function readAccounts() {
            try {
                const raw = localStorage.getItem(ACCOUNTS_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (err) {
                return [];
            }
        }

        function writeAccounts(accounts) {
            try {
                localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
            } catch (err) {
                console.warn('계정 목록 저장 실패:', err);
            }
        }

        function appendAuthLog(entry) {
            try {
                const raw = localStorage.getItem(AUTH_LOGS_KEY);
                const logs = raw ? JSON.parse(raw) : [];
                const list = Array.isArray(logs) ? logs : [];
                list.unshift(entry);
                localStorage.setItem(AUTH_LOGS_KEY, JSON.stringify(list));
            } catch (err) {
                console.warn('인증 이력 저장 실패:', err);
            }
        }

        function completeAccountLogin(accountObj, actionLabel, keepLogin) {
            const nowIso = new Date().toISOString();
            const accounts = readAccounts();
            const idx = accounts.findIndex(
                (acc) => acc && acc.email && acc.email.toLowerCase() === accountObj.email.toLowerCase()
            );

            let updatedAccount;
            if (idx >= 0) {
                const prev = accounts[idx];
                const nextCount = (Number(prev.loginCount) || 0) + 1;
                updatedAccount = {
                    ...prev,
                    ...accountObj,
                    createdAt: prev.createdAt || nowIso,
                    lastLoginAt: nowIso,
                    loginCount: nextCount
                };
                accounts[idx] = updatedAccount;
            } else {
                updatedAccount = {
                    ...accountObj,
                    createdAt: nowIso,
                    lastLoginAt: nowIso,
                    loginCount: 1
                };
                accounts.unshift(updatedAccount);
            }

            writeAccounts(accounts);

            const currentUser = {
                email: updatedAccount.email,
                studentId: updatedAccount.studentId,
                nickname: updatedAccount.nickname,
                favCategory: updatedAccount.favCategory,
                provider: updatedAccount.provider || '이메일',
                loginCount: updatedAccount.loginCount,
                lastLoginAt: updatedAccount.lastLoginAt,
                keepLogin: Boolean(keepLogin),
                loggedIn: true
            };

            try {
                localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser));
            } catch (err) {
                console.warn('현재 사용자 저장 실패:', err);
            }

            const logEntry = {
                action: actionLabel,
                email: updatedAccount.email,
                studentId: updatedAccount.studentId,
                nickname: updatedAccount.nickname,
                favCategory: updatedAccount.favCategory,
                loginCount: updatedAccount.loginCount,
                keepLogin: Boolean(keepLogin),
                timestamp: nowIso
            };
            appendAuthLog(logEntry);

            if (typeof getAppState === 'function' && typeof saveAppState === 'function') {
                const state = getAppState();
                state.user = {
                    email: updatedAccount.email,
                    studentId: updatedAccount.studentId,
                    nickname: updatedAccount.nickname,
                    favCategory: updatedAccount.favCategory,
                    loginCount: updatedAccount.loginCount
                };
                state.accounts = accounts;
                state.keepLogin = Boolean(keepLogin);
                state.authHistory = Array.isArray(state.authHistory) ? state.authHistory : [];
                state.authHistory.unshift(logEntry);
                saveAppState(state);
            }

            return updatedAccount;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pw = document.getElementById('login-pw').value;
            const keepLogin = document.getElementById('keep-login').checked;

            if (!email) {
                alert('이메일을 입력하세요.');
                return;
            }

            void pw;
            const accounts = readAccounts();
            const matchedAccount = accounts.find(
                (acc) => acc && acc.email && acc.email.toLowerCase() === email.toLowerCase()
            );

            // 등록된 계정이 없으면 회원가입 페이지로 안내 후 이동
            if (!matchedAccount) {
                alert('등록된 계정이 없습니다. 회원가입 화면으로 이동합니다.');
                location.href = `signup.html?email=${encodeURIComponent(email)}`;
                return;
            }

            const updated = completeAccountLogin(matchedAccount, '이메일 로그인', keepLogin);

            if (typeof showToast === 'function') {
                showToast(`${updated.nickname}님 환영합니다! (누적 로그인 ${updated.loginCount}회)`);
            } else {
                alert(`${updated.nickname}님 환영합니다! (누적 로그인 ${updated.loginCount}회)`);
            }

            setTimeout(() => {
                location.href = 'index.html';
            }, 700);
        }

        function socialLogin(providerKey, providerName) {
            const keepLogin = document.getElementById('keep-login').checked;
            const socialEmail = `${providerKey}.student@campus.ac.kr`;
            const accounts = readAccounts();
            const existing = accounts.find(
                (acc) => acc && acc.email && acc.email.toLowerCase() === socialEmail.toLowerCase()
            );

            const baseAccount = existing || {
                email: socialEmail,
                studentId: '23학번',
                nickname: providerName,
                favCategory: '전체',
                provider: providerName
            };

            const updated = completeAccountLogin(baseAccount, `${providerName} 간편 로그인`, keepLogin);

            if (typeof showToast === 'function') {
                showToast(`${updated.nickname} 계정으로 로그인되었습니다. (누적 ${updated.loginCount}회)`);
            } else {
                alert(`${updated.nickname} 계정으로 로그인되었습니다. (누적 ${updated.loginCount}회)`);
            }

            setTimeout(() => {
                location.href = 'index.html';
            }, 700);
        }
    </script>
</body>
</html>
