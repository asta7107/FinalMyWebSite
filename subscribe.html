<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAO - Campus All In One | 월간 멤버십 구독</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* CAO 컬러 기반 다크 네이비 구독 페이지 컨테이너 */
        .sub-hero-wrap {
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            border-radius: 22px;
            padding: 44px 36px 48px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.22);
            margin-bottom: 24px;
        }

        /* 상단 공통 혜택 헤더 (레퍼런스 상단 2분할 구조) */
        .sub-benefits-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
            max-width: 980px;
            margin: 0 auto 42px;
            padding-bottom: 28px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        }

        .sub-benefits-title {
            flex: 1 1 360px;
        }

        .sub-benefits-title .sub-kicker {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.35);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .sub-benefits-title h2 {
            font-size: 1.85rem;
            line-height: 1.35;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .sub-benefits-list {
            flex: 1 1 320px;
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 9px;
            font-size: 0.94rem;
            color: #e2e8f0;
        }

        .sub-benefits-list li {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub-benefits-list li span.chk {
            color: #60a5fa;
            font-weight: 800;
            font-size: 1rem;
        }

        /* 하단 3열 요금제 카드 그리드 */
        .plan-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1040px;
            margin: 0 auto;
        }

        .plan-card {
            position: relative;
            background: #162033;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 28px 22px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .plan-card:hover {
            transform: translateY(-4px);
            border-color: rgba(96, 165, 250, 0.55);
            box-shadow: 0 12px 28px rgba(2, 6, 23, 0.45);
        }

        /* 좌측 상단 프로모션 배지 */
        .plan-ribbon {
            position: absolute;
            top: 0;
            left: 0;
            background: #93c5fd;
            color: #0f172a;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 6px 14px;
            border-top-left-radius: 15px;
            border-bottom-right-radius: 12px;
        }

        .plan-card.has-ribbon {
            padding-top: 44px;
            border-color: rgba(147, 197, 253, 0.45);
        }

        .plan-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .plan-name {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }

        /* 카드별 포인트 컬러 (CAO 블루 / 앰버 / 그린) */
        .plan-personal .plan-name { color: #93c5fd; }
        .plan-duo .plan-name { color: #fbbf24; }
        .plan-basic .plan-name { color: #4ade80; }

        .plan-price-main {
            font-size: 0.98rem;
            font-weight: 700;
            color: #f8fafc;
            margin: 0 0 4px;
        }

        .plan-price-sub {
            font-size: 0.8rem;
            color: #94a3b8;
            margin: 0 0 18px;
            line-height: 1.4;
        }

        .plan-divider {
            height: 1px;
            background: rgba(148, 163, 184, 0.18);
            margin: 0 0 18px;
        }

        .plan-features {
            list-style: disc;
            padding-left: 18px;
            margin: 0 0 26px;
            display: grid;
            gap: 9px;
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.45;
        }

        .plan-cta {
            display: block;
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 13px 16px;
            font-size: 0.93rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            margin-bottom: 14px;
        }

        .plan-cta:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        .plan-personal .plan-cta {
            background: #93c5fd;
            color: #0f172a;
        }

        .plan-duo .plan-cta {
            background: #fbbf24;
            color: #0f172a;
        }

        .plan-basic .plan-cta {
            background: #4ade80;
            color: #0f172a;
        }

        .plan-footnote {
            font-size: 0.72rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.45;
            margin: 0;
        }

        .plan-footnote a {
            color: #cbd5e1;
            text-decoration: underline;
        }

        /* 구독 신청 완료 안내 모달/배너 */
        .sub-status-box {
            max-width: 1040px;
            margin: 22px auto 0;
            background: rgba(59, 130, 246, 0.14);
            border: 1px solid rgba(96, 165, 250, 0.4);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.92rem;
            color: #e0f2fe;
            display: none;
        }

        @media (max-width: 920px) {
            .plan-grid {
                grid-template-columns: 1fr;
                max-width: 440px;
            }
            .sub-hero-wrap {
                padding: 28px 20px 32px;
            }
            .sub-benefits-title h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header id="app-header"></header>

            <div class="sub-benefits-header">
                <div class="sub-benefits-title">
                    <span class="sub-kicker">🎓 CAO CAMPUS PLUS</span>

                    <li><span class="chk">✓</span> 광고 없이 쾌적한 캠퍼스 브리핑</li>

                    <li><span class="chk">✓</span> 팀플 정산 내역 영수증 PDF/엑셀 내보내기</li>
